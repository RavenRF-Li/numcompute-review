[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumCompute and a NumPy decision-tree framework for streaming classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
include = ["numcompute*"]
